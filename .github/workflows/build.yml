          package com.example.attendancewidget

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar

          data class Subject(
              var name: String,
              var days: MutableSet<Int>,          // 0 = Mon ... 6 = Sun
              var states: MutableMap<Int, Int>,   // is hafte ka: day -> 1 present, 2 absent
              var present: Int,
              var held: Int
          )

          object Store {
              private const val PREFS = "attendance"
              private const val KEY = "data"
              const val TARGET = 75
              val DAY_NAMES = listOf("Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun")

              // B.Tech 1st Sem, Mechanical, Group 2
              private fun defaultSubjects(): MutableList<Subject> = listOf(
                  "Math" to listOf(0, 3, 4),
                  "Math Tutorial" to listOf(0, 2, 3),
                  "Chemistry" to listOf(0, 3, 4),
                  "Economics" to listOf(0, 1, 2, 3),
                  "BOE" to listOf(1, 2, 4),
                  "FOEE" to listOf(1, 2, 4),
                  "UHV-II" to listOf(3, 4),
                  "BOE Lab" to listOf(0),
                  "Chemistry Lab" to listOf(1),
                  "FOEE Lab" to listOf(3)
              ).map { (n, d) -> Subject(n, d.toMutableSet(), mutableMapOf(), 0, 0) }.toMutableList()

              fun loadTimetable(ctx: Context) = save(ctx, defaultSubjects())

              fun todayIndex(): Int = (Calendar.getInstance().get(Calendar.DAY_OF_WEEK) + 5) % 7

              // Har hafte ki Monday ke hisab se ek unique number
              private fun weekKey(): Int {
                  val c = Calendar.getInstance()
                  val dow = (c.get(Calendar.DAY_OF_WEEK) + 5) % 7 // Mon = 0
                  c.add(Calendar.DAY_OF_YEAR, -dow)
                  return c.get(Calendar.YEAR) * 1000 + c.get(Calendar.DAY_OF_YEAR)
              }

              fun load(ctx: Context): MutableList<Subject> {
                  val prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val raw = prefs.getString(KEY, null)
                  if (raw == null) {
                      val d = defaultSubjects()
                      save(ctx, d)
                      return d
                  }
                  val root = JSONObject(raw)
                  val list = mutableListOf<Subject>()
                  val arr = root.getJSONArray("subjects")
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val days = mutableSetOf<Int>()
                      val da = o.getJSONArray("days")
                      for (j in 0 until da.length()) days.add(da.getInt(j))
                      val states = mutableMapOf<Int, Int>()
                      val so = o.getJSONObject("states")
                      val keys = so.keys()
                      while (keys.hasNext()) {
                          val k = keys.next()
                          states[k.toInt()] = so.getInt(k)
                      }
                      list.add(Subject(o.getString("name"), days, states, o.getInt("present"), o.getInt("held")))
                  }
                  // Naya hafta shuru hua to circles reset (% waisa hi rahega)
                  if (root.getInt("week") != weekKey()) {
                      list.forEach { it.states.clear() }
                      save(ctx, list)
                  }
                  return list
              }

              fun save(ctx: Context, list: List<Subject>) {
                  val arr = JSONArray()
                  for (s in list) {
                      val o = JSONObject()
                      o.put("name", s.name)
                      o.put("days", JSONArray(s.days.toList()))
                      val so = JSONObject()
                      for ((k, v) in s.states) so.put(k.toString(), v)
                      o.put("states", so)
                      o.put("present", s.present)
                      o.put("held", s.held)
                      arr.put(o)
                  }
                  val root = JSONObject().put("week", weekKey()).put("subjects", arr)
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, root.toString()).apply()
              }

              // Jin dino ke columns widget me dikhne hain
              fun activeDays(list: List<Subject>): List<Int> =
                  list.flatMap { it.days }.distinct().sorted()

              // Tap: circle -> present -> absent -> circle
              fun cycle(ctx: Context, index: Int, day: Int) {
                  val list = load(ctx)
                  val s = list.getOrNull(index) ?: return
                  if (day !in s.days) return
                  val old = s.states[day] ?: 0
                  val new = (old + 1) % 3
                  if (old == 1) { s.present--; s.held-- } else if (old == 2) { s.held-- }
                  if (new == 1) { s.present++; s.held++ } else if (new == 2) { s.held++ }
                  if (new == 0) s.states.remove(day) else s.states[day] = new
                  save(ctx, list)
              }
          }
          EOF_05
          cat > $P/app/src/main/java/com/example/attendancewidget/AttendanceWidget.kt <<'EOF_06'
          package com.example.attendancewidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.view.View
          import android.widget.RemoteViews

          class AttendanceWidget : AppWidgetProvider() {

              companion object {
                  const val ACTION_TAP = "com.example.attendancewidget.TAP"
                  const val EXTRA_SUBJECT = "subject"
                  const val EXTRA_DAY = "day"
                  private val HEADERS = intArrayOf(
                      R.id.h0, R.id.h1, R.id.h2, R.id.h3, R.id.h4, R.id.h5, R.id.h6
                  )

                  fun refreshAll(ctx: Context) {
                      val mgr = AppWidgetManager.getInstance(ctx)
                      val ids = mgr.getAppWidgetIds(ComponentName(ctx, AttendanceWidget::class.java))
                      for (id in ids) update(ctx, mgr, id)
                      mgr.notifyAppWidgetViewDataChanged(ids, R.id.list)
                  }

                  private fun update(ctx: Context, mgr: AppWidgetManager, id: Int) {
                      val views = RemoteViews(ctx.packageName, R.layout.widget_attendance)
                      val active = Store.activeDays(Store.load(ctx))
                      val today = Store.todayIndex()
                      val hl = Color.parseColor("#66FFE98A")
                      for (d in 0..6) {
                          views.setViewVisibility(HEADERS[d], if (d in active) View.VISIBLE else View.GONE)
                          views.setInt(HEADERS[d], "setBackgroundColor", if (d == today) hl else Color.TRANSPARENT)
                      }

                      val svc = Intent(ctx, AttendanceService::class.java)
                      svc.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                      svc.data = Uri.parse(svc.toUri(Intent.URI_INTENT_SCHEME))
                      views.setRemoteAdapter(R.id.list, svc)
                      views.setEmptyView(R.id.list, R.id.empty)

                      val tap = Intent(ctx, AttendanceWidget::class.java).setAction(ACTION_TAP)
                      views.setPendingIntentTemplate(
                          R.id.list,
                          PendingIntent.getBroadcast(
                              ctx, 0, tap,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                          )
                      )

                      val open = PendingIntent.getActivity(
                          ctx, 1, Intent(ctx, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.btn_settings, open)
                      views.setOnClickPendingIntent(R.id.empty, open)

                      mgr.updateAppWidget(id, views)
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  refreshAll(context)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_TAP) {
                      Store.cycle(
                          context,
                          intent.getIntExtra(EXTRA_SUBJECT, -1),
                          intent.getIntExtra(EXTRA_DAY, -1)
                      )
                      refreshAll(context)
                  }
              }
          }
          EOF_06
          cat > $P/app/src/main/java/com/example/attendancewidget/AttendanceService.kt <<'EOF_07'
          package com.example.attendancewidget

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.view.View
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService

          private val CELLS = intArrayOf(
              R.id.c0, R.id.c1, R.id.c2, R.id.c3, R.id.c4, R.id.c5, R.id.c6
          )

          class AttendanceService : RemoteViewsService() {

              override fun onGetViewFactory(intent: Intent): RemoteViewsService.RemoteViewsFactory =
                  Factory(applicationContext)

              class Factory(private val ctx: Context) : RemoteViewsService.RemoteViewsFactory {
                  private var subjects: List<Subject> = emptyList()
                  private var active: List<Int> = emptyList()

                  override fun onCreate() {}

                  override fun onDataSetChanged() {
                      subjects = Store.load(ctx)
                      active = Store.activeDays(subjects)
                  }

                  override fun onDestroy() {}
                  override fun getCount(): Int = subjects.size
                  override fun getLoadingView(): RemoteViews? = null
                  override fun getViewTypeCount(): Int = 1
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun hasStableIds(): Boolean = true

                  override fun getViewAt(position: Int): RemoteViews {
                      val v = RemoteViews(ctx.packageName, R.layout.widget_row)
                      val s = subjects.getOrNull(position) ?: return v
                      val today = Store.todayIndex()
                      val hl = Color.parseColor("#66FFE98A")
                      v.setTextViewText(R.id.r_name, s.name)

                      for (d in 0..6) {
                          val id = CELLS[d]
                          if (d !in active) {
                              v.setViewVisibility(id, View.GONE)
                              continue
                          }
                          v.setViewVisibility(id, View.VISIBLE)
                          v.setInt(id, "setBackgroundColor", if (d == today) hl else Color.TRANSPARENT)
                          if (d !in s.days) {
                              v.setTextViewText(id, "-")
                              v.setTextColor(id, Color.parseColor("#55FFFFFF"))
                          } else {
                              when (s.states[d] ?: 0) {
                                  1 -> {
                                      v.setTextViewText(id, "\u25CF")
                                      v.setTextColor(id, Color.parseColor("#4CAF50"))
                                  }
                                  2 -> {
                                      v.setTextViewText(id, "\u2715")
                                      v.setTextColor(id, Color.parseColor("#F44336"))
                                  }
                                  else -> {
                                      v.setTextViewText(id, "\u25CB")
                                      v.setTextColor(id, Color.WHITE)
                                  }
                              }
                              val fill = Intent()
                                  .putExtra(AttendanceWidget.EXTRA_SUBJECT, position)
                                  .putExtra(AttendanceWidget.EXTRA_DAY, d)
                              v.setOnClickFillInIntent(id, fill)
                          }
                      }

                      if (s.held == 0) {
                          v.setTextViewText(R.id.r_pct, "--")
                          v.setTextColor(R.id.r_pct, Color.parseColor("#B0BEC5"))
                      } else {
                          val pct = s.present * 100.0 / s.held
                          val ok = s.present * 100 >= Store.TARGET * s.held
                          val txt = if (pct % 1.0 == 0.0) pct.toInt().toString() + "%" else String.format("%.1f%%", pct)
                          v.setTextViewText(R.id.r_pct, txt)
                          v.setTextColor(R.id.r_pct, Color.parseColor(if (ok) "#4CAF50" else "#F44336"))
                      }
                      return v
                  }
              }
          }
          EOF_07
