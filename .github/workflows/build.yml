          package com.example.attendancewidget

          import android.app.Activity
          import android.app.AlertDialog
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var container: LinearLayout

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val page = LinearLayout(this)
                  page.orientation = LinearLayout.VERTICAL
                  page.setPadding(dp(16), dp(16), dp(16), dp(24))

                  val title = TextView(this)
                  title.text = "Mere Subjects"
                  title.textSize = 24f
                  page.addView(title)

                  val help = TextView(this)
                  help.text = "Widget lagane ke liye: home screen pe khali jagah long-press karo, Widgets me jao aur Attendance chuno.\n\nSubject edit karne ke liye naam pe tap karo."
                  help.setPadding(0, dp(6), 0, dp(10))
                  page.addView(help)

                  container = LinearLayout(this)
                  container.orientation = LinearLayout.VERTICAL
                  page.addView(container)

                  val add = Button(this)
                  add.text = "+ Subject add karo"
                  add.setOnClickListener { showDialog(null) }
                  page.addView(add)

                  val tt = Button(this)
                  tt.text = "Time table (Group 2) dobara load karo"
                  tt.setOnClickListener { confirmTimetable() }
                  page.addView(tt)

                  val reset = Button(this)
                  reset.text = "Attendance reset karo"
                  reset.setOnClickListener { confirmReset() }
                  page.addView(reset)

                  val scroll = ScrollView(this)
                  scroll.addView(page)
                  setContentView(scroll)
                  render()
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun render() {
                  container.removeAllViews()
                  val list = Store.load(this)
                  if (list.isEmpty()) {
                      val t = TextView(this)
                      t.text = "Abhi koi subject nahi hai."
                      t.setPadding(0, dp(12), 0, dp(12))
                      container.addView(t)
                  }
                  list.forEachIndexed { i, s ->
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setPadding(0, dp(8), 0, dp(8))

                      val days = s.days.sorted().joinToString(", ") { Store.DAY_NAMES[it] }
                      val info = TextView(this)
                      info.text = s.name + "\n" + days + "   (" + s.present + "/" + s.held + ")"
                      info.textSize = 16f
                      info.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      info.setOnClickListener { showDialog(i) }
                      row.addView(info)

                      val del = Button(this)
                      del.text = "Delete"
                      del.setOnClickListener { confirmDelete(i) }
                      row.addView(del)

                      container.addView(row)
                  }
              }

              private fun changed() {
                  render()
                  AttendanceWidget.refreshAll(this)
              }

              private fun showDialog(index: Int?) {
                  val list = Store.load(this)
                  val existing: Subject? = if (index != null) list.getOrNull(index) else null

                  val input = EditText(this)
                  input.hint = "Subject ka naam (jaise Math)"
                  input.setSingleLine()
                  input.setText(existing?.name ?: "")

                  val label = TextView(this)
                  label.text = "Kis kis din class hoti hai?"
                  label.setPadding(0, dp(12), 0, dp(4))

                  val boxes = ArrayList<CheckBox>()
                  for (i in 0..6) {
                      val cb = CheckBox(this)
                      cb.text = Store.DAY_NAMES[i]
                      cb.isChecked = existing?.days?.contains(i) ?: false
                      boxes.add(cb)
                  }

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(dp(24), dp(16), dp(24), 0)
                  layout.addView(input)
                  layout.addView(label)
                  for (cb in boxes) layout.addView(cb)

                  val sv = ScrollView(this)
                  sv.addView(layout)

                  AlertDialog.Builder(this)
                      .setTitle(if (existing == null) "Subject add karo" else "Subject edit karo")
                      .setView(sv)
                      .setPositiveButton("Save") { _, _ ->
                          val name = input.text.toString().trim()
                          val days = mutableSetOf<Int>()
                          for (i in 0..6) if (boxes[i].isChecked) days.add(i)
                          if (name.isEmpty() || days.isEmpty()) {
                              Toast.makeText(this, "Naam aur kam se kam ek din chuno", Toast.LENGTH_SHORT).show()
                          } else {
                              if (existing == null) {
                                  list.add(Subject(name, days, mutableMapOf(), 0, 0))
                              } else {
                                  // Jo din hata diye, unki marked entry wapas lo
                                  for (d in existing.days.toList()) {
                                      if (d !in days) {
                                          val st = existing.states[d] ?: 0
                                          if (st == 1) { existing.present--; existing.held-- }
                                          else if (st == 2) { existing.held-- }
                                          existing.states.remove(d)
                                      }
                                  }
                                  existing.name = name
                                  existing.days = days
                              }
                              Store.save(this, list)
                              changed()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun confirmDelete(index: Int) {
                  AlertDialog.Builder(this)
                      .setMessage("Ye subject delete kar du?")
                      .setPositiveButton("Delete") { _, _ ->
                          val list = Store.load(this)
                          if (index in list.indices) list.removeAt(index)
                          Store.save(this, list)
                          changed()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun confirmTimetable() {
                  AlertDialog.Builder(this)
                      .setMessage("Purane subjects hat jayenge aur time table wale subjects aa jayenge. Pakka?")
                      .setPositiveButton("Haan") { _, _ ->
                          Store.loadTimetable(this)
                          changed()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun confirmReset() {
                  AlertDialog.Builder(this)
                      .setMessage("Sabhi subjects ki attendance 0 kar du? (Subjects rahenge)")
                      .setPositiveButton("Reset") { _, _ ->
                          val list = Store.load(this)
                          for (s in list) { s.states.clear(); s.present = 0; s.held = 0 }
                          Store.save(this, list)
                          changed()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          }
